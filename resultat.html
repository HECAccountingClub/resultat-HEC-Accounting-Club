<title>Résultat du recrutement | HEC Accounting Club</title>
<style>
:root{
  --bg:#071328; --card:#0e2247; --card2:#122b58; --line:#c79a2b55;
  --gold:#e3b84a; --gold2:#f7dc8a; --goldd:#c79a2b; --navy:#10284f;
  --text:#eef3fb; --muted:#aebcd3; --green:#12b76a; --red:#ff6b7a;
  --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --head:Poppins,var(--font);
  font-family:var(--font); color:var(--text);
}
html[lang="ar"]{--font:Cairo,"Segoe UI",Tahoma,Arial,sans-serif;--head:Cairo,var(--font)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; min-height:100dvh; padding:64px 16px 28px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:
    radial-gradient(900px 500px at 85% -10%,#1e4a8a66,transparent 60%),
    radial-gradient(700px 500px at -10% 110%,#c79a2b44,transparent 60%),
    var(--bg);
  position:relative; overflow-x:hidden; transition:background .6s;
}
body.accepted-bg{background:radial-gradient(900px 520px at 80% -10%,#12b76a55,transparent 60%),radial-gradient(700px 500px at -10% 110%,#c79a2b55,transparent 60%),#06231a}
body.rejected-bg{background:radial-gradient(900px 500px at 80% -10%,#ff4d6155,transparent 60%),radial-gradient(700px 500px at -10% 110%,#8c1d2e66,transparent 60%),#1c070d}
body.pending-bg{background:radial-gradient(900px 500px at 80% -10%,#3b82f655,transparent 60%),#071328}
/* étoiles dorées qui scintillent */
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--gold2);opacity:0;animation:twinkle 4s ease-in-out infinite}
.card,footer,.lang{position:relative;z-index:1}

.lang{position:fixed;top:max(14px,env(safe-area-inset-top));inset-inline-end:14px;z-index:5;display:flex;gap:2px;padding:4px;border-radius:999px;background:#ffffff14;border:1px solid #ffffff22;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.lang button{min-height:34px;padding:0 14px;border-radius:999px;background:transparent;color:var(--muted);font-size:.85rem;font-weight:700;box-shadow:none;border:0;cursor:pointer;font-family:inherit}
.lang button::after{display:none}
.lang button[aria-pressed="true"]{background:linear-gradient(100deg,var(--goldd),var(--gold2));color:var(--navy)}

.card{
  width:min(100%,520px); text-align:center; border-radius:32px;
  padding:clamp(28px,6vw,48px) clamp(22px,6vw,44px);
  background:linear-gradient(180deg,#112a56ee,#0b1c3dee);
  border:1px solid var(--line);
  box-shadow:0 30px 80px #02091a99,0 0 0 1px #ffffff0a inset,0 0 60px #c79a2b18;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  animation:cardin .7s cubic-bezier(.2,.8,.2,1) both;
}
.card.result.ok{background:linear-gradient(180deg,#0e3a2cee,#08241bee);border-color:#12b76a66;box-shadow:0 30px 80px #02140d99,0 0 70px #12b76a2e}
.card.result.no{background:linear-gradient(180deg,#4a1219ee,#2a0a10ee);border-color:#ff6b7a88;box-shadow:0 30px 80px #1a040899,0 0 70px #ff6b7a33}
.card.shake{animation:shake .5s}

.logo-wrap{position:relative;width:clamp(112px,28vw,136px);height:clamp(112px,28vw,136px);margin:0 auto 20px;animation:float 5s ease-in-out infinite}
.logo-wrap::before{content:"";position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(from 0deg,var(--goldd),#fff3c4,var(--goldd),#3b82f6,var(--goldd));animation:spin 8s linear infinite}
.logo-wrap::after{content:"";position:absolute;inset:-3px;border-radius:50%;background:var(--card)}
.club-logo{position:relative;z-index:1;display:block;width:100%;height:100%;object-fit:contain;border-radius:50%}

.brand{margin:0 0 8px;color:var(--gold);text-transform:uppercase;font-weight:800;letter-spacing:.18em;font-size:.76rem}
h1{font-family:var(--head);font-size:clamp(2rem,7vw,2.7rem);line-height:1.15;letter-spacing:-.01em;margin:0;
  background:linear-gradient(100deg,#fff 20%,var(--gold2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.intro{font-size:clamp(1rem,3.4vw,1.1rem);line-height:1.65;color:var(--muted);margin:18px auto 26px;max-width:30em}

form{display:grid;gap:14px}
.field{position:relative}
.field svg{position:absolute;inset-inline-start:20px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--muted);pointer-events:none;transition:color .2s}
.field:focus-within svg{color:var(--gold)}
input{width:100%;min-height:64px;border:2px solid #ffffff22;border-radius:18px;padding:0 20px;padding-inline-start:58px;background:#ffffff0f;color:#fff;font:inherit;font-size:1.15rem;letter-spacing:.08em;outline:none;direction:ltr;text-align:start;transition:border-color .2s,box-shadow .2s,background .2s}
html[dir="rtl"] input{text-align:right}
input::placeholder{color:#8496b4;letter-spacing:.1em}
input:focus{border-color:var(--gold);background:#ffffff16;box-shadow:0 0 0 5px #e3b84a26}
.hint{margin:0;font-size:.88rem;color:#8ea0bd;text-align:start;padding:0 6px}

button,.btn{position:relative;overflow:hidden;border:0;border-radius:18px;min-height:62px;padding:14px 22px;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(100deg,var(--goldd),var(--gold2));color:var(--navy);font:inherit;font-size:1.08rem;font-weight:800;cursor:pointer;text-decoration:none;
  box-shadow:0 10px 26px #c79a2b44;transition:transform .15s,box-shadow .2s,filter .2s,opacity .2s}
button::after,.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#ffffff77,transparent);transform:skewX(-20deg);animation:shine 3.8s ease-in-out infinite}
button:hover:not(:disabled),.btn:hover{transform:translateY(-2px);box-shadow:0 14px 32px #c79a2b66}
button:active:not(:disabled),.btn:active{transform:translateY(1px)}
button:disabled{opacity:.6;cursor:wait;box-shadow:none}
button.loading::before{content:"";width:1.05em;height:1.05em;border:2px solid #10284f44;border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite}
button:focus-visible,.btn:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold2);outline-offset:3px}
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

.alert{margin-top:22px;padding:16px 18px;border-radius:16px;background:#ff6b7a1c;border:1px solid #ff6b7a66;color:#ffc9cf;text-align:start;line-height:1.6;animation:rise .4s ease both}
.small-note{font-size:.85rem;color:#8ea0bd;line-height:1.6;margin:20px 0 0}

/* résultat */
.badge{width:100px;height:100px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
.badge svg{width:64px;height:64px;fill:none;stroke-linecap:round;stroke-linejoin:round}
.badge.ok{background:#12b76a26;box-shadow:0 0 0 10px #12b76a14,0 0 40px #12b76a55}
.badge.ok svg{stroke:#3be08f;stroke-width:4}
.badge.ok .c{stroke-dasharray:145;stroke-dashoffset:145;animation:draw .8s .15s ease forwards}
.badge.ok .t{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .75s ease forwards}
.badge.wait,.badge.info{background:#3b82f622}.badge.wait svg,.badge.info svg{stroke:#8fb8ff;stroke-width:3.5}
.badge.no{background:#ff6b7a1f}.badge.no svg{stroke:var(--red);stroke-width:3.5}
.result h2{font-family:var(--head);margin:0;font-size:clamp(1.8rem,6vw,2.4rem);line-height:1.25;color:#fff}
.result.ok h2{color:#7cf0b3}
.result.no h2{color:#ff8f9b}
.result.no .lead{color:#ffd3d8}
.result.no .msg{color:#f3c2c8}
.result.no .who{color:#ffb3bc}
.who{margin:10px 0 0;color:var(--gold2);font-weight:800;font-size:1.15rem;overflow-wrap:anywhere}
.lead{margin:16px 0 18px;color:#d3ddee;line-height:1.7;font-size:1.08rem}
.dept{margin:0 0 22px;padding:18px 16px;border-radius:16px;border:1px solid #12b76a66;border-inline-start:6px solid #3be08f;background:#12b76a1f;color:#a8f5cb;font-weight:800;font-size:clamp(1.15rem,4vw,1.4rem)}
.msg{margin:0 0 22px;color:#d3ddee;line-height:1.8;font-size:1.05rem}
.msg .g{color:var(--gold);font-weight:800}.msg .n{color:#fff;font-weight:800}
.grid{display:grid;grid-template-columns:1fr;gap:12px;margin:20px 0}
.item{padding:16px;border-radius:15px;background:#ffffff0f;border:1px solid #ffffff14;overflow-wrap:anywhere}
.item small{display:block;color:var(--muted);margin-bottom:6px}.item b{font-size:1.08rem;color:#fff}
.reveal{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.25s + var(--i,0) * .11s)}

/* vidéo Instagram */
.video{margin:0 0 22px}
.ig-card{width:100%;min-height:0;aspect-ratio:16/10;padding:18px;border-radius:20px;flex-direction:column;gap:10px;color:#fff;
  background:linear-gradient(135deg,#515bd4 0%,#8134af 30%,#dd2a7b 62%,#feda77 100%);box-shadow:0 14px 34px #8134af55}
.ig-card::after{display:block}
.ig-logo{width:46px;height:46px;border:3px solid #fff;border-radius:14px;display:grid;place-items:center}
.ig-logo i{width:20px;height:20px;border:3px solid #fff;border-radius:50%;position:relative;display:block}
.ig-logo i::after{content:"";position:absolute;top:-8px;inset-inline-end:-8px;width:4px;height:4px;background:#fff;border-radius:50%}
.ig-play{width:58px;height:58px;border-radius:50%;background:#fff;color:#dd2a7b;display:grid;place-items:center;font-size:1.3rem;padding-inline-start:4px;animation:pulse 2s ease-out infinite}
.ig-card b{font-size:1.08rem}.ig-card span{font-size:.92rem;opacity:.95}
.ig-embed{width:100%;height:620px;max-height:78vh;border:0;border-radius:20px;background:#fff;display:block;box-shadow:0 14px 34px #0006}
.ig-open{display:inline-block;margin-top:12px;color:var(--gold2);font-weight:700;font-size:.95rem}

.btn.join{display:flex;width:100%;margin:0 0 14px;animation:rise .6s both,glow 2.6s 1.2s ease-in-out infinite}
.ghost{width:100%;min-height:56px;border:1.5px solid #ffffff33;background:#ffffff0d;color:#fff;font-weight:700;box-shadow:none}
.ghost::after{display:none}
.ghost:hover:not(:disabled){background:#ffffff1a;box-shadow:none}
.row{display:grid;gap:12px}

footer{width:min(100%,520px);color:var(--muted);text-align:center;line-height:1.7;margin:24px auto 0;overflow-wrap:anywhere;animation:rise .8s .4s both}
footer .help{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:1.05rem;color:#fff}
footer svg{width:22px;height:22px}
footer a{color:var(--gold2);font-weight:700}
footer small{display:block;margin-top:8px;opacity:.55;font-size:.75rem}
canvas{position:fixed;inset:0;pointer-events:none;z-index:9}

@keyframes twinkle{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:.9;transform:scale(1.4)}}
@keyframes cardin{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 #ffffffaa}100%{box-shadow:0 0 0 22px #ffffff00}}
@keyframes glow{0%,100%{box-shadow:0 10px 26px #c79a2b44}50%{box-shadow:0 10px 40px #f7dc8a99}}
@media(max-width:480px){body{padding:60px 12px 22px}.card{border-radius:26px}input{min-height:60px}}
@media(prefers-reduced-motion:reduce){.stars i,.logo-wrap,.logo-wrap::before,button::after,.btn::after,.ig-play,.btn.join{animation-iteration-count:1!important}}
</style>
</head>

/* ---------- Numéro de téléphone ---------- */
function cleanPhone(v){ return String(v || "").replace(/\D/g, ""); }
function phoneVariants(digits){
  let local = digits;
  if(local.startsWith("00216")) local = local.slice(5);
  else if(local.startsWith("216") && local.length === 11) local = local.slice(3);
  const list = [digits];
  if(local !== digits) list.push(local);
  if(local.length === 8) list.push("216" + local);
  return [...new Set(list)];
}
// Mise en forme automatique « XX XXX XXX » pour un numéro local à 8 chiffres
phoneInput.addEventListener("input", () => {
  const raw = phoneInput.value;
  if(/^\s*(\+|00|216)/.test(raw)) return;
  if(phoneInput.selectionStart !== raw.length) return;
  const d = cleanPhone(raw).slice(0,8);
  phoneInput.value = d.replace(/^(\d{0,2})(\d{0,3})(\d{0,3}).*$/, (m,a,b,c) => [a,b,c].filter(Boolean).join(" "));
});

function escapeHTML(v){
  return String(v ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch]));
}

/* ---------- Limite de tentatives (anti-devinette) ---------- */
let attempts = [], blockedUntil = 0;
function tooMany(){
  const now = Date.now();
  if(now < blockedUntil) return Math.ceil((blockedUntil - now)/1000);
  attempts = attempts.filter(x => now - x < 60000);
  if(attempts.length >= 6){ blockedUntil = now + 30000; return 30; }
  attempts.push(now); return 0;
}

/* ---------- Résultat ---------- */
function classify(status){
  const norm = String(status ?? "").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9' -]/g, " ").replace(/\s+/g, " ").trim();
  // Trois cas voulus : FAVORABLE → félicitations / DEFAVORABLE → « Malheureusement » (rouge) / pas d'entretien (cellule vide, « sans entretien »…) → « Malheureusement » (rouge)
  // 0) codes de la fonction Supabase : FF = favorable, DF = défavorable
  if(/^ff$/.test(norm)) return "ok";
  if(/^df$/.test(norm)) return "no";
  // 1) refus explicite (testé AVANT l'acceptation : « non admis », « pas retenu », « défavorable »…)
  const rejected = /^(non|n|df|nf|d)$/.test(norm)
    || /defavorable|infavorable|refus|rejet|echec|echoue|elimine|malheureusement|declin/.test(norm)
    || /\b(non|pas|jamais|sans)\b[ -]*(favorable|accept|admis|retenu|affecte|selectionne)/.test(norm);
  if(rejected) return "no";
  // 2) acceptation
  if(/favorable|accept|admis|retenu|affecte|selectionne|felicit|\boui\b|\bok\b/.test(norm)) return "ok";
  // 3) tout le reste (cellule vide, « sans entretien », etc.) → message « Malheureusement »
  return "no";
}
// Département lu dans la base (colonne « departement ») : « département Com », « قسم Com »…
function deptLabel(raw){
  const d = String(raw ?? "").trim();
  if(!d) return "HEC Accounting Club";
  const word = lang === "ar" ? "قسم " : "département ";
  const already = /^(le |la |l['’])?d[eé]partement\b/i.test(d) || /^قسم/.test(d);
  const nice = d.charAt(0).toUpperCase() + d.slice(1);
  return escapeHTML(already ? d : word + nice);
}
// La base peut contenir « Nom et prenom » dans une seule colonne : on accepte plusieurs noms de champs
function normalizeCandidate(c){
  c = c || {};
  const pick = (...k) => { for(const x of k){ if(c[x] !== undefined && c[x] !== null && String(c[x]).trim() !== "") return String(c[x]).trim(); } return ""; };
  const prenom = pick("prenom");
  const nom = pick("nom");
  const full = pick("nom_et_prenom","nom_prenom","nom_complet","full_name","fullname","full") || [prenom, nom].filter(Boolean).join(" ");
  return { prenom, nom, full, resultat: pick("resultat","result","statut","status"), departement: pick("departement","department","dept") };
}

/* ---------- Mélodie de félicitations ---------- */
let audioCtx = null;
function prepAudio(){            // appelé au clic (obligatoire sur iPhone), la mélodie est jouée plus tard
  if(!SOUND) return;
  try{ audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); }catch(e){}
}
function celebrate(){
  if(!SOUND) return;
  try{ navigator.vibrate && navigator.vibrate([90,50,90,50,160]); }catch(e){}
  try{
    if(!audioCtx) return;
    const notes = [523.25, 659.25, 783.99, 1046.5], t0 = audioCtx.currentTime + .05;
    notes.forEach((f,i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = f;
      const st = t0 + i*.13;
      g.gain.setValueAtTime(0, st); g.gain.linearRampToValueAtTime(.18, st+.03); g.gain.exponentialRampToValueAtTime(.0001, st+.55);
      o.connect(g); g.connect(audioCtx.destination); o.start(st); o.stop(st+.6);
    });
  }catch(e){}
}

/* ---------- Confettis ---------- */
function startConfetti(){
  const canvas = document.createElement("canvas");
  canvas.width = innerWidth * devicePixelRatio;
  canvas.height = innerHeight * devicePixelRatio;
  canvas.style.width = innerWidth + "px";
  canvas.style.height = innerHeight + "px";
  document.body.appendChild(canvas);
  const ctx = canvas.getContext("2d");
  ctx.scale(devicePixelRatio, devicePixelRatio);
  const colors = ["#e3b84a","#f7dc8a","#ffffff","#3be08f","#3b82f6"];
  const pieces = Array.from({length:120}, () => ({
    x:Math.random()*innerWidth, y:-Math.random()*innerHeight*.8, s:5+Math.random()*7, v:2+Math.random()*4,
    r:Math.random()*6, w:(Math.random()-.5)*1.6, c:colors[Math.floor(Math.random()*colors.length)]
  }));
  let frame = 0;
  (function draw(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    pieces.forEach(p => {
      p.y += p.v; p.x += p.w; p.r += .06;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore();
    });
    frame++;
    if(frame < 230 && pieces.some(p => p.y < innerHeight + 20)) requestAnimationFrame(draw); else canvas.remove();
  })();
}

  alertBox.innerHTML = ""; lastErrorKey = null;
  try{
    // Fonction RPC attendue côté Supabase : get_candidate_result_v2(p_telephone) → nom_et_prenom, resultat, departement (voir get_candidate_result.sql)
    let rows = [];
    for(const variant of phoneVariants(telephone)){
      let res = await withTimeout(db.rpc(rpcName, {p_telephone:variant}), 15000);
      // v2 pas encore créée dans Supabase → on retombe sur la fonction d'origine
      if(res.error && rpcName === "get_candidate_result_v2" && /could not find|PGRST202|does not exist/i.test(JSON.stringify(res.error))){
        rpcName = "get_candidate_result";
        res = await withTimeout(db.rpc(rpcName, {p_telephone:variant}), 15000);
      }
      const {data,error} = res;
      if(error){ console.error("Supabase RPC error:", error); showError("eFail"); if(DEBUG) alertBox.insertAdjacentHTML("beforeend", '<pre style="text-align:start;direction:ltr;white-space:pre-wrap;word-break:break-all;margin:10px 0 0;padding:12px;border-radius:12px;background:#0006;color:#ffb4bc;font-size:.8rem">ERREUR SUPABASE\n'+escapeHTML(JSON.stringify(error, null, 1))+'</pre>'); return; }
      rows = Array.isArray(data) ? data : (data ? [data] : []);
      if(rows.length) break;
    }
    if(rows.length === 0){
      showError("eNone");
      if(DEBUG) alertBox.insertAdjacentHTML("beforeend", '<pre style="text-align:start;direction:ltr;white-space:pre-wrap;word-break:break-all;margin:10px 0 0;padding:12px;border-radius:12px;background:#0006;color:#9fe;font-size:.8rem">DEBUG\nfonction utilisée : '+escapeHTML(rpcName)+'\nnuméros essayés : '+escapeHTML(phoneVariants(telephone).join(" , "))+'\nlignes reçues : 0</pre>');
      return;
    }
    if(rows.length > 1){ showError("eMany"); return; }
    showResult(rows[0]);
  }catch(error){
    console.error(error);
    showError("eNet");
  }finally{
    busy = false; button.disabled = false;
    button.classList.remove("loading");
    button.textContent = t("verify");
  }
});

applyLang();
</script>
